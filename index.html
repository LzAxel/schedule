<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <meta name="description" content="Расписание занятий группы ФТ23ДР62ПФ с чётными и нечётными неделями, временем пар и аудиториями.">
  <title>Расписание · ФТ23ДР62ПФ</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="schedule.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="site-shell">
    <main>
      <section class="schedule-section" aria-label="Расписание занятий">
        <div class="week-toolbar">
          <div class="week-navigation">
            <button class="icon-button" id="previous-week" type="button" aria-label="Предыдущая неделя">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="icons.svg#arrow-left"/></svg>
            </button>
            <div class="week-name" aria-live="polite"><strong id="week-range"></strong><span id="week-subtitle"></span></div>
            <button class="icon-button" id="next-week" type="button" aria-label="Следующая неделя">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="icons.svg#arrow-right"/></svg>
            </button>
          </div>
          <div class="week-actions"><span class="week-badge" id="week-badge"></span><button class="today-button" id="today-button" type="button">Сегодня</button></div>
        </div>

        <nav class="day-nav" id="day-nav" aria-label="Перейти к дню недели"></nav>
        <div class="days-grid" id="days-grid"></div>
      </section>
    </main>
  </div>
</body>
</html>
